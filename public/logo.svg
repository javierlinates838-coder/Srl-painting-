<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="400" height="440">
  <!-- Outer black stroke of house -->
  <path fill="#111" d="M200 16 L368 108 V392 H32 V108 Z"/>
  <!-- White house border -->
  <path fill="#fff" stroke="#111" stroke-width="3" d="M200 28 L352 112 V380 H48 V112 Z"/>
  <!-- House interior white gap -->
  <path fill="#fff" d="M200 40 L340 118 V368 H60 V118 Z"/>
  <!-- Maroon hexagon -->
  <path fill="#7a1832" stroke="#111" stroke-width="2.5" d="M200 72 L310 136 V352 H90 V136 Z"/>
  <!-- Roof area fill maroon -->
  <path fill="#7a1832" d="M90 136 L130 112 L130 88 L158 88 L200 68 L242 88 L270 88 L270 112 L310 136 L200 68 Z"/>
  <!-- Chimney -->
  <path fill="#7a1832" stroke="#111" stroke-width="2" d="M130 88 V68 H158 V112 L130 96 Z"/>
  <!-- SRL -->
  <text x="200" y="210" text-anchor="middle" fill="#fff" stroke="#111" stroke-width="3" paint-order="stroke fill" font-family="Georgia, 'Times New Roman', Times, serif" font-size="78" font-weight="700" letter-spacing="-3">SRL</text>
  <!-- Paintbrush in L -->
  <g transform="translate(248, 138) rotate(10)">
    <rect x="0" y="0" width="5" height="30" rx="1" fill="#fff" stroke="#111" stroke-width="0.8"/>
    <path d="M-1.5 30 L6.5 30 L5 40 L0.5 40 Z" fill="#111"/>
    <ellipse cx="2.75" cy="42" rx="4" ry="2.5" fill="#fff" stroke="#111" stroke-width="0.8"/>
  </g>
  <!-- Painting -->
  <text x="200" y="258" text-anchor="middle" fill="#fff" stroke="#111" stroke-width="2" paint-order="stroke fill" font-family="Georgia, 'Times New Roman', Times, serif" font-size="30" font-weight="600">Painting</text>
  <!-- License -->
  <text x="200" y="318" text-anchor="middle" fill="#111" font-family="Georgia, 'Times New Roman', Times, serif" font-size="14" font-weight="700" letter-spacing="0.5">Lic. 1108313</text>
</svg>
