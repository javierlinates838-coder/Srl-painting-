<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" role="img" aria-label="SRL Painting">
  <defs>
    <linearGradient id="maroon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9B2242"/>
      <stop offset="100%" stop-color="#6E1428"/>
    </linearGradient>
  </defs>

  <!-- Outer black stroke -->
  <path
    d="M160 18 L298 98 L298 318 L22 318 L22 98 Z"
    fill="#111"
  />

  <!-- White border -->
  <path
    d="M160 28 L286 100 L286 306 L34 306 L34 100 Z"
    fill="#fff"
  />

  <!-- House body (maroon) -->
  <path
    d="M160 40 L274 104 L274 294 L46 294 L46 104 Z"
    fill="url(#maroon)"
    stroke="#111"
    stroke-width="2"
    stroke-linejoin="round"
  />

  <!-- Roof peak detail -->
  <path
    d="M46 104 L88 78 L112 68 L160 48 L208 68 L232 78 L274 104 L274 98 L160 44 L46 98 Z"
    fill="#6E1428"
    stroke="#111"
    stroke-width="1.5"
    stroke-linejoin="round"
  />

  <!-- Chimney (left) -->
  <path
    d="M72 72 L72 52 L96 52 L96 82 L88 78 L72 72 Z"
    fill="#6E1428"
    stroke="#111"
    stroke-width="1.5"
    stroke-linejoin="round"
  />

  <!-- SRL -->
  <text
    x="160"
    y="178"
    text-anchor="middle"
    fill="#fff"
    stroke="#111"
    stroke-width="2.5"
    paint-order="stroke fill"
    font-family="Georgia, 'Times New Roman', Times, serif"
    font-size="72"
    font-weight="700"
    letter-spacing="-1"
  >SRL</text>

  <!-- Paintbrush inside L -->
  <g transform="translate(198, 132) rotate(15)">
    <rect x="0" y="0" width="5" height="28" rx="1" fill="#fff" stroke="#111" stroke-width="0.8"/>
    <path d="M-2 28 L7 28 L5 38 L0 38 Z" fill="#111"/>
    <ellipse cx="2.5" cy="40" rx="4" ry="2.5" fill="#fff" stroke="#111" stroke-width="0.8"/>
  </g>

  <!-- Painting -->
  <text
    x="160"
    y="222"
    text-anchor="middle"
    fill="#fff"
    stroke="#111"
    stroke-width="1.5"
    paint-order="stroke fill"
    font-family="Georgia, 'Times New Roman', Times, serif"
    font-size="28"
    font-weight="600"
  >Painting</text>

  <!-- License -->
  <text
    x="160"
    y="268"
    text-anchor="middle"
    fill="#111"
    font-family="Georgia, 'Times New Roman', Times, serif"
    font-size="13"
    font-weight="700"
    letter-spacing="0.5"
  >Lic. 1108313</text>
</svg>
